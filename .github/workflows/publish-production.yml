name: Build and publish production

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type production to confirm the Google Play release"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: google-play-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push' || inputs.confirm_production == 'production'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing and publishing credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_JSON_BASE64: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          printf '%s' "$PLAY_JSON_BASE64" | base64 --decode > "$RUNNER_TEMP/play-service-account.json"
          chmod 600 "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/play-service-account.json"

      - name: Build signed Android App Bundle
        env:
          ANDROID_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          PLAY_GAMES_APP_ID: ${{ secrets.PLAY_GAMES_APP_ID }}
          LEADERBOARD_XP: ${{ secrets.LEADERBOARD_XP }}
          LEADERBOARD_STREAK: ${{ secrets.LEADERBOARD_STREAK }}
          ACHIEVEMENTS_CSV: ${{ secrets.ACHIEVEMENTS_CSV }}
        run: |
          set -euo pipefail
          build_number="$(date +%s)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version_name="${GITHUB_REF_NAME#v}"
          else
            version_name="1.0.${GITHUB_RUN_NUMBER}"
          fi
          BUILD_NUMBER="$build_number" VERSION_NAME="$version_name" ./gradlew bundleRelease --no-daemon

      - name: Install Google Play API client
        run: python3 -m pip install --disable-pip-version-check google-auth google-api-python-client

      - name: Configure required Play Store contact
        env:
          PLAY_CONTACT_EMAIL: ${{ secrets.PLAY_CONTACT_EMAIL }}
          PLAY_CONTACT_WEBSITE: ${{ secrets.PLAY_CONTACT_WEBSITE }}
        run: |
          set -euo pipefail
          if [[ -z "$PLAY_CONTACT_EMAIL" ]]; then
            echo "Missing required repository secret PLAY_CONTACT_EMAIL" >&2
            exit 1
          fi
          args=(
            --credentials "$RUNNER_TEMP/play-service-account.json"
            --contact-email "$PLAY_CONTACT_EMAIL"
          )
          if [[ -n "$PLAY_CONTACT_WEBSITE" ]]; then
            args+=(--contact-website "$PLAY_CONTACT_WEBSITE")
          fi
          python3 tools/configure_play_compliance.py "${args[@]}"

      - name: Publish to Google Play production
        run: |
          python3 tools/upload_play_store.py \
            --credentials "$RUNNER_TEMP/play-service-account.json" \
            --package-name fr.audeladedonnees.examen.civique \
            --metadata fastlane/metadata/android \
            --track production \
            --release-status completed \
            --aab app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed bundle as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parcours-citoyen-release
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 30
