<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12233f">
  <title>{% block title %}Parcours citoyen{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="tricolour" aria-hidden="true"><i></i><i></i><i></i></div>
  <header class="site-header wrap">
    <a class="brand" href="{{ url_for('home') }}"><span class="brand-mark">✦</span><span>PARCOURS<br><strong>CITOYEN</strong></span><span class="mini-flag" aria-label="Drapeau français"><i></i><i></i><i></i></span></a>
    <button class="menu-toggle" type="button" aria-controls="primary-nav" aria-expanded="false" aria-label="Ouvrir le menu"><span></span><span></span><span></span></button>
    <nav id="primary-nav" aria-label="Navigation principale">
      <a href="{{ url_for('home') }}#parcours">Examens</a>
      <a href="{{ url_for('home') }}#sujets">Sujets</a>
      <a href="{{ url_for('guide') }}">Guide</a>
      <a href="{{ url_for('hymn') }}">Hymne</a>
      <a href="{{ url_for('french') }}">Français</a>
      <a href="{{ url_for('centers') }}">Centres</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="site-footer wrap"><span>Parcours citoyen · entraînement indépendant</span><span>Les résultats du site ne sont pas une attestation officielle.</span></footer>
  {% block scripts %}{% endblock %}
  <script src="{{ url_for('static', filename='mobile-nav.js') }}" defer></script>
</body>
</html>
